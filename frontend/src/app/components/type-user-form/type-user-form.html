<form [formGroup]="typeUserFormGroup" (ngSubmit)="onSubmit()">
	<div>
		<label for="typeName">Type name</label>
		<input id="typeName" type="text" formControlName="typeName">
	</div>
	<button type="submit" class="btn btn-primary btn-sm">
		{{existingTypeUser ? 'Update user type' : 'Add user type'}}
	</button>
</form>
