<form [formGroup]="typeUserFormGroup" (ngSubmit)="onSubmit()" ngNativeValidate>
	<div>
		<label for="typeName">Type name</label>
		<input id="typeName" type="text" formControlName="typeName" required>
	</div>
	<a routerLink="/types">
		<button type="button" class="btn btn-danger btn-sm">Cancel</button>
	</a>
	<button type="submit" class="btn btn-primary btn-sm">
		{{existingTypeUser ? 'Update user type' : 'Add user type'}}
	</button>
</form>
